<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unblocked Websites</title>
    <style>
      :root {
        --bg: #0e0f13;
        --panel: #181b22;
        --panel-2: #1f2430;
        --text: #f3f6fb;
        --muted: #b9c1d0;
        --accent: #ff6a6a;
        --accent-2: #ffd166;
        --accent-3: #7bd389;
        --shadow: rgba(0, 0, 0, 0.32);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #0b1020, var(--bg));
        color: var(--text);
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 32px 16px 48px;
      }

      .container {
        width: min(980px, 100%);
      }

      h1 {
        text-align: center;
        font-size: clamp(2rem, 5vw, 3.5rem);
        margin: 0 0 18px;
      }

      .subtitle {
        text-align: center;
        color: var(--muted);
        margin: 0 0 28px;
        font-size: 1.05rem;
      }

      .button-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
        margin-bottom: 32px;
      }

      .site-btn {
        border: none;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--accent), #ff8a80);
        color: white;
        padding: 22px 16px;
        font-size: clamp(1rem, 2.2vw, 1.5rem);
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 10px 20px var(--shadow);
        transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
        min-height: 82px;
      }

      .site-btn:nth-child(3n + 2) {
        background: linear-gradient(135deg, var(--accent-2), #ffbd59);
        color: #1d1d1d;
      }

      .site-btn:nth-child(3n + 3) {
        background: linear-gradient(135deg, var(--accent-3), #67d39f);
        color: #0d2414;
      }

      .site-btn:hover {
        transform: translateY(-2px) scale(1.01);
        filter: brightness(1.05);
      }

      .site-btn:active {
        transform: translateY(0);
      }

      .suggestion-box {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        padding: 20px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.2);
      }

      .suggestion-box h2 {
        margin-top: 0;
        margin-bottom: 14px;
        font-size: 1.6rem;
      }

      .form-row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }

      .form-row input {
        flex: 1 1 240px;
        min-width: 0;
        padding: 14px 16px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: var(--panel-2);
        color: var(--text);
        font-size: 1rem;
      }

      .form-row button {
        padding: 14px 18px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #5fa8ff, #7f7bff);
        color: white;
        font-weight: 700;
        cursor: pointer;
      }

      .status {
        color: var(--muted);
        min-height: 24px;
        margin: 8px 0 14px;
      }

      .note {
        color: var(--muted);
        font-size: 0.95rem;
        margin: 12px 0 0;
      }

      @media (max-width: 500px) {
        .form-row {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Cherry · Tongue Tongue · Strawberry</h1>
      <p class="subtitle">Open a site below</p>

      <div id="button-grid" class="button-grid"></div>

      <div class="suggestion-box">
        <h2>Request a site</h2>
        <form id="site-form">
          <div class="form-row">
            <input id="site-name" type="text" placeholder="Site name" maxlength="40" required />
            <input id="site-url" type="url" placeholder="https://example.com" required />
            <button type="submit">Add button</button>
          </div>
        </form>

        <div id="status" class="status">Add a site name and URL to make a new button.</div>
        <p class="note">
          The buttons are shared through a backend. If no backend is configured yet, the page falls back to local storage.
        </p>
      </div>
    </div>

    <script>
      const SHARED_API = 'PASTE_YOUR_GOOGLE_APPS_SCRIPT_URL_HERE';
      const STORAGE_KEY = 'unblocked-websites-buttons';
      const defaultSites = [
        { name: 'Cherry', url: 'https://s3.amazonaws.com/ow9bpeb/index.html' },
        { name: 'Tongue Tongue', url: 'https://djz51oelf1hfk.cloudfront.net/' },
        { name: 'Strawberry', url: 'https://chrisets.s3.amazonaws.com/index.html#goog_rewarded' },
        { name: 'Strawberry', url: 'https://s3.amazonaws.com/strawberrii/index.svg' }
      ];

      function loadLocalSites() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
          return Array.isArray(saved) ? saved : defaultSites;
        } catch {
          return defaultSites;
        }
      }

      function saveLocalSites(sites) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(sites));
      }

      async function loadSites() {
        if (!SHARED_API || SHARED_API.includes('PASTE_')) {
          return loadLocalSites();
        }

        try {
          const response = await fetch(`${SHARED_API}?action=get`, { cache: 'no-store' });
          if (!response.ok) throw new Error('Fetch failed');
          const json = await response.json();
          if (Array.isArray(json.sites) && json.sites.length > 0) {
            return json.sites;
          }
        } catch (error) {
          console.warn('Shared API unavailable, using local data instead.', error);
        }

        return loadLocalSites();
      }

      function renderButtons(sites) {
        const grid = document.getElementById('button-grid');
        grid.innerHTML = '';

        sites.forEach((site) => {
          const button = document.createElement('button');
          button.className = 'site-btn';
          button.type = 'button';
          button.textContent = site.name;
          button.addEventListener('click', () => {
            window.open(site.url, '_blank', 'noopener,noreferrer');
          });
          grid.appendChild(button);
        });
      }

      async function refreshSites() {
        const sites = await loadSites();
        renderButtons(sites);
      }

      const form = document.getElementById('site-form');
      const status = document.getElementById('status');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const name = document.getElementById('site-name').value.trim();
        const url = document.getElementById('site-url').value.trim();

        if (!name || !url) {
          status.textContent = 'Please enter both a site name and a valid URL.';
          return;
        }

        try {
          const parsed = new URL(url);
          if (!['http:', 'https:'].includes(parsed.protocol)) {
            throw new Error('Invalid protocol');
          }

          if (SHARED_API && !SHARED_API.includes('PASTE_')) {
            const response = await fetch(SHARED_API, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name, url: parsed.href })
            });

            const json = await response.json();

            if (!response.ok || json.ok === false) {
              status.textContent = json.message || 'This site was rejected by the filter.';
              return;
            }

            status.textContent = 'Site added successfully.';
            form.reset();
            await refreshSites();
            return;
          }

          const sites = loadLocalSites();
          sites.unshift({ name, url: parsed.href });
          saveLocalSites(sites);
          form.reset();
          status.textContent = 'Site added successfully.';
          renderButtons(sites);
        } catch (err) {
          status.textContent = 'Please enter a valid http or https URL.';
        }
      });

      refreshSites();
    </script>
  </body>
</html>
