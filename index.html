<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unblocked Websites</title>
    <style>
      :root {
        --bg: #0e0f13;
        --panel: #181b22;
        --panel-2: #1f2430;
        --text: #f3f6fb;
        --muted: #b9c1d0;
        --accent: #ff6a6a;
        --accent-2: #ffd166;
        --accent-3: #7bd389;
        --shadow: rgba(0, 0, 0, 0.32);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #0b1020, var(--bg));
        color: var(--text);
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 32px 16px 48px;
      }

      .container {
        width: min(900px, 100%);
      }

      h1 {
        text-align: center;
        font-size: clamp(2rem, 5vw, 3.3rem);
        margin: 0 0 20px;
      }

      .subtitle {
        text-align: center;
        color: var(--muted);
        margin: 0 0 28px;
        font-size: 1.05rem;
      }

      .button-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
        margin-bottom: 32px;
      }

      .site-btn {
        border: none;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--accent), #ff8a80);
        color: white;
        padding: 22px 16px;
        font-size: clamp(1rem, 2.2vw, 1.5rem);
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 10px 20px var(--shadow);
        transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
      }

      .site-btn:nth-child(2n) {
        background: linear-gradient(135deg, var(--accent-2), #ffbd59);
        color: #1d1d1d;
      }

      .site-btn:nth-child(3n) {
        background: linear-gradient(135deg, var(--accent-3), #67d39f);
        color: #0d2414;
      }

      .site-btn:hover {
        transform: translateY(-2px) scale(1.01);
        filter: brightness(1.05);
      }

      .site-btn:active {
        transform: translateY(0);
      }

      .suggestion-box {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        padding: 20px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.2);
      }

      .suggestion-box h2 {
        margin-top: 0;
        margin-bottom: 14px;
        font-size: 1.6rem;
      }

      form {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }

      input[type="url"] {
        flex: 1 1 300px;
        min-width: 0;
        padding: 14px 16px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: var(--panel-2);
        color: var(--text);
        font-size: 1rem;
      }

      button[type="submit"] {
        padding: 14px 18px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #5fa8ff, #7f7bff);
        color: white;
        font-weight: 700;
        cursor: pointer;
      }

      .status {
        color: var(--muted);
        min-height: 24px;
        margin: 8px 0 14px;
      }

      .suggested-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .suggested-list li {
        background: rgba(255, 255, 255, 0.04);
        border-radius: 10px;
        padding: 10px 12px;
        word-break: break-all;
        color: var(--muted);
      }

      @media (max-width: 500px) {
        form {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Cherry · Tongue Tongue · Strawberry</h1>
      <p class="subtitle">Open a site below</p>

      <div class="button-grid">
        <button class="site-btn" data-url="https://s3.amazonaws.com/ow9bpeb/index.html">Cherry</button>
        <button class="site-btn" data-url="https://djz51oelf1hfk.cloudfront.net/">Tongue Tongue</button>
        <button class="site-btn" data-url="https://chrisets.s3.amazonaws.com/index.html#goog_rewarded">Strawberry</button>
        <button class="site-btn" data-url="https://s3.amazonaws.com/strawberrii/index.svg">Strawberry</button>
      </div>

      <div class="suggestion-box">
        <h2>Submit a new URL</h2>
        <form id="url-form">
          <input id="url-input" type="url" placeholder="Paste a new URL here" required />
          <button type="submit">Send</button>
        </form>
        <div id="status" class="status">Your suggestion will be reviewed and added later.</div>

        <ul id="suggested-list" class="suggested-list"></ul>
      </div>
    </div>

    <script>
      const buttons = document.querySelectorAll('.site-btn');
      buttons.forEach((button) => {
        button.addEventListener('click', () => {
          const url = button.getAttribute('data-url');
          window.open(url, '_blank', 'noopener,noreferrer');
        });
      });

      const form = document.getElementById('url-form');
      const urlInput = document.getElementById('url-input');
      const status = document.getElementById('status');
      const list = document.getElementById('suggested-list');

      function renderSuggestions() {
        const saved = JSON.parse(localStorage.getItem('siteSuggestions') || '[]');
        list.innerHTML = '';

        if (!saved.length) {
          const item = document.createElement('li');
          item.textContent = 'No suggestions yet.';
          list.appendChild(item);
          return;
        }

        saved.forEach((url) => {
          const item = document.createElement('li');
          item.textContent = url;
          list.appendChild(item);
        });
      }

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const value = urlInput.value.trim();

        if (!value) {
          status.textContent = 'Please enter a valid URL.';
          return;
        }

        const saved = JSON.parse(localStorage.getItem('siteSuggestions') || '[]');
        if (!saved.includes(value)) {
          saved.unshift(value);
          localStorage.setItem('siteSuggestions', JSON.stringify(saved));
        }

        urlInput.value = '';
        status.textContent = 'Thanks! Your URL has been saved and will be reviewed.';
        renderSuggestions();
      });

      renderSuggestions();
    </script>
  </body>
</html>
